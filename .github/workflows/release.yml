name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Check the version matches the tag
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from file.version import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          if tag != __version__:
              sys.exit(f"Tag {tag} does not match file/version.py ({__version__})")
      
      - name: Build
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: AC2SaveFileViewer-windows
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
